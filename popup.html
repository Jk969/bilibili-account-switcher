<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>账号切换</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h2 id="popupTitle">账号切换器</h2>
      <div class="header-actions">
        <button id="refreshBtn" title="刷新列表" class="icon-btn">↻</button>
        <button id="settingsBtn" title="设置" class="icon-btn">⚙</button>
      </div>
    </header>

    <div id="siteBanner" class="site-banner" style="display: none;">
      <span class="site-host" id="siteHost"></span>
      <span class="site-count" id="siteCount"></span>
    </div>

    <div id="accountList" class="account-list">
      <!-- 账号列表动态插入 -->
      <div class="empty-tip">暂无账号，请登录后添加</div>
    </div>

    <div id="settingsPanel" class="settings-panel" style="display: none;">
      <div class="settings-header">
        <h3>设置</h3>
        <button id="settingsCloseBtn" class="icon-btn">×</button>
      </div>
      <div class="settings-content">
        <div class="setting-item">
          <label>
            <input type="checkbox" id="globalFloatingToggle"> 全局启用网页悬浮窗
          </label>
        </div>
        <div class="setting-item">
          <label>
            <input type="checkbox" id="siteFloatingToggle"> 在当前网站启用悬浮窗
          </label>
        </div>
        <div class="settings-tip">
          提示：悬浮窗默认只在“已保存有账号”的网站上显示，以避免在其他网页浏览时产生视觉干扰。
        </div>
        <hr class="settings-divider">
        <div class="setting-item setting-row">
          <button id="exportBtn" class="secondary-btn setting-action-btn">导出账号</button>
          <button id="importBtn" class="secondary-btn setting-action-btn">导入账号</button>
          <input type="file" id="importFile" accept="application/json" hidden>
        </div>
        <div class="settings-tip">
          导出/导入用于备份或在另一台电脑恢复账号（仅限本地，请勿分享——其中含登录凭据）。
        </div>
      </div>
    </div>

    <footer>
      <button id="addCurrentBtn" class="primary-btn">添加当前账号</button>
      <button id="loginNewBtn" class="secondary-btn">登录新账号</button>
      <div class="hint-text">
        注意：添加多账号时，请点“登录新账号”清除本地状态，<span class="warning">切勿在网页点击退出</span>，否则旧账号Cookie会失效。
      </div>
    </footer>
    
    <div id="statusMsg" class="status-msg"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
